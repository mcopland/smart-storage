[package]
name = "engine"
version = "0.1.0"
edition = "2021"
# Floor set by wasm-bindgen 0.2.123; keep in sync when bumping the pin below.
rust-version = "1.77"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thiserror = "2"
# Pinned exactly: the generated JS glue must match the wasm-bindgen-cli that
# wasm-pack resolves from this version; a floating patch level can produce
# ABI mismatches at runtime. Bump deliberately, together with a wasm rebuild.
wasm-bindgen = "=0.2.123"

[dev-dependencies]
serde_json = "1"
